<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }
  #terminal { width: 100%; height: 100%; }
  .xterm { padding: 4px; }
</style>
</head>
<body>
<div id="terminal"></div>
<script type="module">
  import { Terminal } from './xterm.js';
  import { FitAddon } from './xterm-addon-fit.js';

  const params = new URLSearchParams(location.search);
  const initFontSize = parseInt(params.get('fontSize') || '14', 10);
  const initTheme = params.get('theme') || 'dark';

  const darkTheme = {
    background: '#0a0a0c',
    foreground: '#fafafa',
    cursor: '#eab308',
    selectionBackground: 'rgba(234,179,8,0.3)',
    black: '#09090b',
    red: '#ef4444',
    green: '#22c55e',
    yellow: '#eab308',
    blue: '#3b82f6',
    magenta: '#a855f7',
    cyan: '#06b6d4',
    white: '#fafafa',
  };

  const lightTheme = {
    background: '#fefefe',
    foreground: '#1c1917',
    cursor: '#b45309',
    selectionBackground: 'rgba(180,83,9,0.15)',
    black: '#1c1917',
    red: '#dc2626',
    green: '#16a34a',
    yellow: '#b45309',
    blue: '#2563eb',
    magenta: '#9333ea',
    cyan: '#0891b2',
    white: '#f5f5f4',
  };

  const theme = initTheme === 'light' ? lightTheme : darkTheme;
  document.body.style.background = theme.background;

  const term = new Terminal({
    cursorBlink: true,
    fontSize: initFontSize,
    fontFamily: 'monospace',
    theme: theme,
  });
  const fitAddon = new FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));

  setTimeout(() => fitAddon.fit(), 100);

  term.onData(data => {
    if (window.Android) window.Android.sendInput(data);
  });

  term.onResize(({cols, rows}) => {
    if (window.Android) window.Android.onTermResize(cols, rows);
  });

  window.addEventListener('resize', () => fitAddon.fit());

  const decoder = new TextDecoder('utf-8');
  window.writeToTerminalB64 = (b64) => {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(decoder.decode(bytes));
  };

  window.sendSpecialKey = (seq) => {
    term.focus();
    if (window.Android) window.Android.sendInput(seq);
  };

  window.focusTerminal = () => { term.focus(); };

  window.applySettings = (fontSize, isDark) => {
    const t = isDark ? darkTheme : lightTheme;
    term.options.theme = t;
    term.options.fontSize = fontSize;
    document.body.style.background = t.background;
    try { fitAddon.fit(); } catch(e) {}
  };

  if (window.Android && window.Android.onReady) {
    window.Android.onReady();
  }
</script>
</body>
</html>
