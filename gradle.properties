org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# KSP + Kotlin: avoid "IllegalStateException: Storage ... is already registered"
# (Android Studio / parallel builds; see https://github.com/google/ksp/issues/2072 )
ksp.incremental=false
org.gradle.parallel=false
# Avoid Kotlin compile daemon racing KSP on the same incremental maps
kotlin.compiler.execution.strategy=in-process
